name: paid-quiz-customer-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paid_quiz
      POSTGRES_USER: paid_quiz
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paid_quiz -d paid_quiz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_NAME: paid_quiz
      DB_USER: paid_quiz
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${ADMIN_PORT:-18991}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18990}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://frontend:80"]
    profiles: ["public"]
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
