map $http_cf_connecting_ip $quiz_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}
map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
}
map $uri $quiz_cache_control {
    default "no-cache";
    ~^/api/ "no-store, private";
    ~^/assets/ "public, max-age=31536000, immutable";
    /pay-qrcode.jpg "public, max-age=3600";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $quiz_cache_control always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $quiz_backend http://backend:8000;
        proxy_pass $quiz_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header X-Forwarded-For $quiz_client_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_hide_header Cache-Control;
    }
    location ^~ /admin { return 404; }
    location ~ /\. { return 404; }
    location /assets/ {
        try_files $uri =404;
    }
    location = /pay-qrcode.jpg {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
